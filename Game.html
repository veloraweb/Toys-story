<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Toy Box — Find Your Way Home</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=DM+Serif+Display&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#63c6f2;
    font-family:'Baloo 2',sans-serif;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

/* =====================================================
   HUD
===================================================== */

.hud{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    width:min(1000px,92%);
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:10;
    pointer-events:none;
}

.hudBox{
    background:rgba(255,255,255,.9);
    border:3px solid white;
    padding:7px 15px;
    border-radius:18px;
    color:#31577b;
    font-weight:800;
    font-size:13px;
    box-shadow:
        0 5px 0 rgba(49,87,123,.18),
        0 10px 25px rgba(0,0,0,.12);
}

#score{
    color:#e84d47;
}

#level{
    color:#3155a6;
}

#lives{
    color:#e84d47;
}

/* =====================================================
   SCREENS
===================================================== */

.screen{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    background:
        linear-gradient(
            180deg,
            rgba(48,130,192,.96),
            rgba(92,190,231,.97)
        );

    transition:.8s ease;
}

.screen.hide{
    opacity:0;
    pointer-events:none;
}

.content{
    width:min(650px,90%);
}

.small{
    color:white;
    font-size:11px;
    letter-spacing:5px;
    font-weight:800;
    text-transform:uppercase;
    margin-bottom:20px;
}

.title{
    font-family:'DM Serif Display',serif;
    font-size:clamp(55px,10vw,110px);
    color:white;
    line-height:.82;
    text-shadow:
        5px 6px 0 rgba(40,83,139,.35);
}

.title span{
    color:#ffd84d;
    display:block;
}

.description{
    color:white;
    opacity:.9;
    max-width:500px;
    margin:30px auto;
    font-size:14px;
    line-height:1.8;
}

.button{
    border:4px solid white;
    background:#ffd84d;
    color:#5b4817;
    padding:13px 32px;
    border-radius:50px;
    font-family:'Baloo 2';
    font-weight:800;
    font-size:18px;
    cursor:pointer;
    box-shadow:
        0 7px 0 #bd972a,
        0 15px 30px rgba(0,0,0,.2);
    transition:.2s;
}

.button:hover{
    transform:translateY(-4px);
}

.button:active{
    transform:translateY(4px);
    box-shadow:
        0 3px 0 #bd972a;
}

.controls{
    margin-top:25px;
    color:white;
    opacity:.75;
    font-size:11px;
}

/* =====================================================
   MESSAGE
===================================================== */

.message{
    position:fixed;
    inset:0;
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:.5s;
    background:rgba(20,45,70,.45);
    backdrop-filter:blur(7px);
}

.message.show{
    opacity:1;
    pointer-events:auto;
}

.messageBox{
    width:min(560px,88%);
    background:#fff8e8;
    border:5px solid white;
    border-radius:25px;
    padding:40px;
    text-align:center;
    box-shadow:
        0 15px 0 rgba(60,90,110,.18),
        0 30px 60px rgba(0,0,0,.25);
}

.messageIcon{
    font-size:55px;
}

.messageTitle{
    font-family:'DM Serif Display',serif;
    color:#31577b;
    font-size:42px;
    margin:10px 0;
}

.messageText{
    color:#63798a;
    font-size:14px;
    line-height:1.8;
    margin-bottom:25px;
}

/* =====================================================
   MOBILE
===================================================== */

.mobile{
    position:fixed;
    bottom:20px;
    left:0;
    right:0;
    z-index:20;
    display:none;
    justify-content:space-between;
    padding:0 20px;
    pointer-events:none;
}

.mobile button{
    pointer-events:auto;
    width:68px;
    height:68px;
    border-radius:50%;
    border:4px solid white;
    background:#ffd84d;
    color:#5b4817;
    font-size:28px;
    font-weight:900;
    box-shadow:0 6px 0 #bd972a;
}

.mobile button:active{
    transform:translateY(5px);
    box-shadow:0 1px 0 #bd972a;
}

@media(max-width:750px){

    .mobile{
        display:flex;
    }

    .hud{
        top:10px;
    }

    .hudBox{
        font-size:10px;
        padding:6px 9px;
    }

}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- =====================================================
     HUD
===================================================== -->

<div class="hud">

    <div class="hudBox">
        ⭐ <span id="score">0</span>
    </div>

    <div class="hudBox">
        LEVEL <span id="level">1</span>
    </div>

    <div class="hudBox">
        <span id="lives">♥ ♥ ♥</span>
    </div>

</div>


<!-- =====================================================
     START SCREEN
===================================================== -->

<div class="screen" id="startScreen">

    <div class="content">

        <div class="small">
            A little toy adventure
        </div>

        <h1 class="title">
            TOY BOX
            <span>ADVENTURE</span>
        </h1>

        <p class="description">
            You fell from the toy shelf.
            Now you have one mission:
            cross the toy room, collect the stars,
            and find your way home.
        </p>

        <button class="button" onclick="startGame()">
            START ADVENTURE
        </button>

        <div class="controls">
            DESKTOP: A / D / ← / → + SPACE TO JUMP
            <br>
            MOBILE: USE THE BUTTONS
        </div>

    </div>

</div>


<!-- =====================================================
     MESSAGE
===================================================== -->

<div class="message" id="message">

    <div class="messageBox">

        <div class="messageIcon" id="messageIcon">
            ⭐
        </div>

        <div class="messageTitle" id="messageTitle">
            A Little Memory
        </div>

        <div class="messageText" id="messageText">
            You found something special.
        </div>

        <button class="button" onclick="continueGame()">
            KEEP GOING
        </button>

    </div>

</div>


<!-- =====================================================
     MOBILE CONTROLS
===================================================== -->

<div class="mobile">

    <button id="leftBtn">
        ←
    </button>

    <button id="jumpBtn">
        ↑
    </button>

    <button id="rightBtn">
        →
    </button>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

let W;
let H;
let DPR;

function resize(){

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   GAME STATE
===================================================== */

let running = false;

let score = 0;

let level = 1;

let lives = 3;

let cameraX = 0;

let frame = 0;

let messageOpen = false;


/* =====================================================
   INPUT
===================================================== */

const keys = {

    left:false,

    right:false,

    jump:false

};


/* =====================================================
   PLAYER
===================================================== */

const player = {

    x:150,

    y:0,

    w:42,

    h:65,

    vx:0,

    vy:0,

    speed:5,

    jumpPower:13,

    grounded:false,

    doubleJump:false,

    invincible:0

};


/* =====================================================
   WORLD
===================================================== */

const world = {

    width:6500,

    floor:0

};


/* =====================================================
   PLATFORMS
===================================================== */

let platforms = [];


/*
    platform format:

    x
    y
    w
    h
*/

function createLevel(){

    platforms=[];

    world.floor =
        H*.78;


    /*
        ground
    */

    platforms.push({

        x:0,

        y:world.floor,

        w:world.width,

        h:H-world.floor

    });


    /*
        level platforms
    */

    const list=[

        [350,530,170],
        [650,450,150],
        [930,560,190],
        [1220,430,160],
        [1510,510,200],
        [1840,390,170],
        [2160,520,180],
        [2460,430,170],
        [2770,550,200],
        [3100,400,170],
        [3400,500,190],
        [3720,370,170],
        [4040,490,200],
        [4380,400,180],
        [4720,520,190],
        [5070,390,180],
        [5400,470,200],
        [5750,350,190]

    ];

    list.forEach(
        p=>{

            platforms.push({

                x:p[0],

                y:p[1],

                w:p[2],

                h:22

            });

        }
    );

}


/* =====================================================
   OBJECTS
===================================================== */

let stars=[];

let enemies=[];

let rockets=[];

let checkpoints=[];


/* =====================================================
   CREATE OBJECTS
===================================================== */

function createObjects(){

    stars=[];

    enemies=[];

    rockets=[];

    checkpoints=[];


    /*
        stars
    */

    for(
        let x=250;
        x<world.width-300;
        x+=230
    ){

        stars.push({

            x:x,

            y:
                world.floor-
                60-
                Math.random()*130,

            r:12,

            collected:false,

            phase:
                Math.random()*Math.PI*2

        });

    }


    /*
        enemies
    */

    const enemyPositions=[

        800,
        1400,
        2000,
        2650,
        3300,
        3950,
        4650,
        5350

    ];

    enemyPositions.forEach(
        x=>{

            enemies.push({

                x:x,

                y:
                    world.floor-35,

                w:45,

                h:35,

                vx:1.2,

                alive:true

            });

        }
    );


    /*
        rocket power ups
    */

    [1800,3600,5200]
    .forEach(
        x=>{

            rockets.push({

                x:x,

                y:
                    world.floor-130,

                collected:false,

                phase:0

            });

        }
    );


    /*
        checkpoints
    */

    [2100,4200]
    .forEach(
        x=>{

            checkpoints.push({

                x:x,

                active:false

            });

        }
    );

}


/* =====================================================
   DRAW SKY
===================================================== */

function drawSky(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#58bce9"
    );

    gradient.addColorStop(
        .65,
        "#a4e3f8"
    );

    gradient.addColorStop(
        1,
        "#e7f7fc"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
        moon/sun
    */

    ctx.fillStyle =
        "rgba(255,235,150,.7)";

    ctx.beginPath();

    ctx.arc(
        W*.78,
        100,
        45,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        clouds
    */

    drawCloud(
        180-cameraX*.08,
        110
    );

    drawCloud(
        600-cameraX*.06,
        180
    );

    drawCloud(
        1050-cameraX*.05,
        100
    );

    drawCloud(
        1500-cameraX*.04,
        160
    );

    drawCloud(
        2100-cameraX*.03,
        110
    );

}


function drawCloud(x,y){

    x =
        ((x%(
            W+500
        ))+W+500)%
        (W+500)-200;

    ctx.fillStyle =
        "rgba(255,255,255,.8)";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        30,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+35,
        y-20,
        40,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+75,
        y,
        30,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   ROOM BACKGROUND
===================================================== */

function drawRoom(){

    /*
        giant clouds on wall
    */

    ctx.save();

    ctx.translate(
        -cameraX*.15,
        0
    );

    for(
        let x=-200;
        x<world.width;
        x+=480
    ){

        drawCloud(
            x,
            H*.27
        );

    }

    ctx.restore();


    /*
        floor
    */

    const floorY =
        world.floor;

    ctx.fillStyle =
        "#c98750";

    ctx.fillRect(
        0,
        floorY,
        W,
        H-floorY
    );


    /*
        wood lines
    */

    ctx.strokeStyle =
        "rgba(100,50,20,.2)";

    ctx.lineWidth=2;

    for(
        let y=floorY+25;
        y<H;
        y+=35
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();

    }

}


/* =====================================================
   DRAW STAR
===================================================== */

function drawStar(
    x,
    y,
    r
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.beginPath();

    for(
        let i=0;
        i<10;
        i++
    ){

        const angle =
            -Math.PI/2+
            i*Math.PI/5;

        const radius =
            i%2===0
            ? r
            : r*.45;

        const px =
            Math.cos(angle)*
            radius;

        const py =
            Math.sin(angle)*
            radius;

        if(i===0)
            ctx.moveTo(
                px,
                py
            );
        else
            ctx.lineTo(
                px,
                py
            );

    }

    ctx.closePath();

    ctx.fillStyle =
        "#ffd84d";

    ctx.shadowColor =
        "#ffd84d";

    ctx.shadowBlur=15;

    ctx.fill();

    ctx.restore();

}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer(){

    const screenX =
        player.x-cameraX;

    const y =
        player.y;


    ctx.save();

    ctx.translate(
        screenX,
        y
    );


    /*
        shadow
    */

    ctx.fillStyle =
        "rgba(0,0,0,.18)";

    ctx.beginPath();

    ctx.ellipse(
        player.w/2,
        player.h+5,
        25,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        legs
    */

    ctx.fillStyle =
        "#3155a6";

    ctx.fillRect(
        8,
        43,
        10,
        22
    );

    ctx.fillRect(
        26,
        43,
        10,
        22
    );


    /*
        boots
    */

    ctx.fillStyle =
        "#82502c";

    ctx.fillRect(
        3,
        60,
        18,
        8
    );

    ctx.fillRect(
        24,
        60,
        18,
        8
    );


    /*
        body
    */

    ctx.fillStyle =
        "#f7e4be";

    roundRect(
        ctx,
        5,
        25,
        34,
        28,
        7
    );

    ctx.fill();


    /*
        vest
    */

    ctx.fillStyle =
        "#92552f";

    ctx.beginPath();

    ctx.moveTo(
        5,
        28
    );

    ctx.lineTo(
        20,
        39
    );

    ctx.lineTo(
        20,
        52
    );

    ctx.lineTo(
        5,
        50
    );

    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        39,
        28
    );

    ctx.lineTo(
        24,
        39
    );

    ctx.lineTo(
        24,
        52
    );

    ctx.lineTo(
        39,
        50
    );

    ctx.closePath();

    ctx.fill();


    /*
        head
    */

    ctx.fillStyle =
        "#f2c597";

    ctx.beginPath();

    ctx.arc(
        22,
        20,
        16,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        ears
    */

    ctx.beginPath();

    ctx.arc(
        7,
        20,
        5,
        0,
        Math.PI*2
    );

    ctx.arc(
        37,
        20,
        5,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        hat
    */

    ctx.fillStyle =
        "#d29a30";

    ctx.beginPath();

    ctx.ellipse(
        22,
        5,
        24,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillRect(
        10,
        -6,
        24,
        12
    );


    /*
        eyes
    */

    ctx.fillStyle =
        "#253247";

    ctx.beginPath();

    ctx.arc(
        16,
        19,
        2,
        0,
        Math.PI*2
    );

    ctx.arc(
        28,
        19,
        2,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        smile
    */

    ctx.strokeStyle =
        "#794b38";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
        22,
        21,
        6,
        0,
        Math.PI
    );

    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   DRAW PLATFORMS
===================================================== */

function drawPlatforms(){

    platforms.forEach(
        p=>{

            const x =
                p.x-cameraX;

            if(
                x+p.w<0 ||
                x>W
            )
                return;


            /*
                wooden top
            */

            ctx.fillStyle =
                "#b86f3c";

            roundRect(
                ctx,
                x,
                p.y,
                p.w,
                p.h,
                7
            );

            ctx.fill();


            /*
                top highlight
            */

            ctx.fillStyle =
                "#e2a15d";

            ctx.fillRect(
                x,
                p.y,
                p.w,
                6
            );


            /*
                stars
            */

            for(
                let i=0;
                i<Math.floor(p.w/50);
                i++
            ){

                drawStar(
                    x+25+i*50,
                    p.y+12,
                    5
                );

            }

        }
    );

}


/* =====================================================
   DRAW STARS
===================================================== */

function drawStars(){

    stars.forEach(
        s=>{

            if(s.collected)
                return;

            const x =
                s.x-cameraX;

            if(
                x<-50 ||
                x>W+50
            )
                return;

            const y =
                s.y+
                Math.sin(
                    frame*.06+s.phase
                )*6;

            drawStar(
                x,
                y,
                s.r
            );

        }
    );

}


/* =====================================================
   DRAW ENEMIES
===================================================== */

function drawEnemies(){

    enemies.forEach(
        e=>{

            if(!e.alive)
                return;

            const x =
                e.x-cameraX;

            if(
                x<-100 ||
                x>W+100
            )
                return;


            /*
                toy bear
            */

            ctx.save();

            ctx.translate(
                x,
                e.y
            );


            ctx.fillStyle =
                "#9c6948";

            ctx.beginPath();

            ctx.arc(
                22,
                10,
                17,
                0,
                Math.PI*2
            );

            ctx.fill();


            /*
                ears
            */

            ctx.beginPath();

            ctx.arc(
                8,
                0,
                8,
                0,
                Math.PI*2
            );

            ctx.arc(
                36,
                0,
                8,
                0,
                Math.PI*2
            );

            ctx.fill();


            /*
                eyes
            */

            ctx.fillStyle =
                "#252525";

            ctx.beginPath();

            ctx.arc(
                16,
                10,
                2,
                0,
                Math.PI*2
            );

            ctx.arc(
                28,
                10,
                2,
                0,
                Math.PI*2
            );

            ctx.fill();


            /*
                nose
            */

            ctx.fillStyle =
                "#38241d";

            ctx.beginPath();

            ctx.arc(
                22,
                16,
                4,
                0,
                Math.PI*2
            );

            ctx.fill();


            ctx.restore();

        }
    );

}


/* =====================================================
   DRAW ROCKETS
===================================================== */

function drawRockets(){

    rockets.forEach(
        r=>{

            if(r.collected)
                return;

            const x =
                r.x-cameraX;

            const y =
                r.y+
                Math.sin(
                    frame*.05
                )*8;

            ctx.save();

            ctx.translate(
                x,
                y
            );

            ctx.rotate(
                -Math.PI/2
            );


            /*
                glow
            */

            ctx.shadowColor =
                "#ffffff";

            ctx.shadowBlur=20;


            /*
                rocket body
            */

            ctx.fillStyle =
                "#f5f5f5";

            ctx.beginPath();

            ctx.moveTo(
                0,
                -30
            );

            ctx.quadraticCurveTo(
                18,
                -5,
                14,
                18
            );

            ctx.lineTo(
                -14,
                18
            );

            ctx.quadraticCurveTo(
                -18,
                -5,
                0,
                -30
            );

            ctx.fill();


            /*
                red stripe
            */

            ctx.fillStyle =
                "#e84d47";

            ctx.fillRect(
                -14,
                5,
                28,
                7
            );


            /*
                window
            */

            ctx.fillStyle =
                "#3155a6";

            ctx.beginPath();

            ctx.arc(
                0,
                -6,
                7,
                0,
                Math.PI*2
            );

            ctx.fill();


            /*
                flame
            */

            ctx.fillStyle =
                "#ffd84d";

            ctx.beginPath();

            ctx.moveTo(
                -8,
                18
            );

            ctx.lineTo(
                0,
                34+
                Math.random()*8
            );

            ctx.lineTo(
                8,
                18
            );

            ctx.closePath();

            ctx.fill();

            ctx.restore();

        }
    );

}


/* =====================================================
   CHECKPOINTS
===================================================== */

function drawCheckpoints(){

    checkpoints.forEach(
        cp=>{

            const x =
                cp.x-cameraX;

            if(
                x<-100 ||
                x>W+100
            )
                return;


            ctx.fillStyle =
                cp.active
                ? "#ffd84d"
                : "#b8c5ce";

            ctx.fillRect(
                x,
                world.floor-100,
                6,
                100
            );


            drawStar(
                x+3,
                world.floor-110,
                15
            );

        }
    );

}


/* =====================================================
   ROUND RECT
===================================================== */

function roundRect(
    ctx,
    x,
    y,
    w,
    h,
    r
){

    ctx.beginPath();

    ctx.moveTo(
        x+r,
        y
    );

    ctx.arcTo(
        x+w,
        y,
        x+w,
        y+h,
        r
    );

    ctx.arcTo(
        x+w,
        y+h,
        x,
        y+h,
        r
    );

    ctx.arcTo(
        x,
        y+h,
        x,
        y,
        r
    );

    ctx.arcTo(
        x,
        y,
        x+w,
        y,
        r
    );

    ctx.closePath();

}


/* =====================================================
   COLLISION PLATFORM
===================================================== */

function platformCollision(){

    player.grounded=false;

    platforms.forEach(
        p=>{

            if(
                player.x+player.w >
                p.x &&
                player.x <
                p.x+p.w &&
                player.y+player.h >
                p.y &&
                player.y+player.h <
                p.y+p.h+player.vy+8 &&
                player.vy>=0
            ){

                player.y =
                    p.y-player.h;

                player.vy=0;

                player.grounded=true;

                player.doubleJump=false;

            }

        }
    );

}


/* =====================================================
   UPDATE PLAYER
===================================================== */

function updatePlayer(){

    /*
        movement
    */

    if(keys.left){

        player.vx =
            -player.speed;

    }
    else if(keys.right){

        player.vx =
            player.speed;

    }
    else{

        player.vx*=.75;

    }


    player.x+=
        player.vx;


    /*
        gravity
    */

    player.vy+=.65;

    player.y+=
        player.vy;


    /*
        platforms
    */

    platformCollision();


    /*
        fall
    */

    if(
        player.y>
        H+200
    ){

        loseLife();

    }


    /*
        boundaries
    */

    player.x =
        Math.max(
            0,
            Math.min(
                world.width-player.w,
                player.x
            )
        );


    /*
        invincible
    */

    if(
        player.invincible>0
    ){

        player.invincible--;

    }

}


/* =====================================================
   JUMP
===================================================== */

function jump(){

    if(!running)
        return;

    if(
        player.grounded
    ){

        player.vy =
            -player.jumpPower;

        player.grounded=false;

        player.doubleJump=false;

    }
    else if(
        !player.doubleJump
    ){

        player.vy =
            -player.jumpPower*.85;

        player.doubleJump=true;

    }

}


/* =====================================================
   COLLECT OBJECTS
===================================================== */

function collectObjects(){

    /*
        stars
    */

    stars.forEach(
        s=>{

            if(
                s.collected
            )
                return;

            const dx =
                player.x+
                player.w/2-
                s.x;

            const dy =
                player.y+
                player.h/2-
                s.y;

            if(
                Math.sqrt(
                    dx*dx+
                    dy*dy
                )<35
            ){

                s.collected=true;

                score+=10;

                updateHUD();

            }

        }
    );


    /*
        rocket
    */

    rockets.forEach(
        r=>{

            if(
                r.collected
            )
                return;

            const dx =
                player.x+
                player.w/2-
                r.x;

            const dy =
                player.y+
                player.h/2-
                r.y;

            if(
                Math.sqrt(
                    dx*dx+
                    dy*dy
                )<40
            ){

                r.collected=true;

                score+=30;

                player.doubleJump=false;

                updateHUD();

                showMessage(
                    "🚀",
                    "To Infinity & Beyond",
                    "You found a rocket! You can now double jump."
                );

                running=false;

            }

        }
    );

}


/* =====================================================
   ENEMY COLLISION
===================================================== */

function enemyCollision(){

    enemies.forEach(
        e=>{

            if(!e.alive)
                return;

            if(
                player.x+player.w >
                e.x &&
                player.x <
                e.x+e.w &&
                player.y+player.h >
                e.y &&
                player.y <
                e.y+e.h
            ){

                /*
                    jump on enemy
                */

                if(
                    player.vy>0 &&
                    player.y+player.h <
                    e.y+20
                ){

                    e.alive=false;

                    player.vy=
                        -player.jumpPower*.7;

                    score+=20;

                    updateHUD();

                }
                else if(
                    player.invincible<=0
                ){

                    loseLife();

                }

            }

        }
    );

}


/* =====================================================
   CHECKPOINT
===================================================== */

function updateCheckpoints(){

    checkpoints.forEach(
        cp=>{

            if(
                !cp.active &&
                player.x>cp.x
            ){

                cp.active=true;

                showMessage(
                    "🏠",
                    "A Little Closer",
                    "Every step brings you closer to home."
                );

                running=false;

            }

        }
    );

}


/* =====================================================
   LOSE LIFE
===================================================== */

function loseLife(){

    if(
        player.invincible>0
    )
        return;

    lives--;

    updateHUD();

    player.invincible=120;

    player.x=
        Math.max(
            100,
            player.x-300
        );

    player.y=
        world.floor-150;

    player.vy=0;

    if(
        lives<=0
    ){

        gameOver();

    }

}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

    const target =
        player.x-
        W*.35;

    cameraX +=
        (target-cameraX)*
        .08;

    cameraX =
        Math.max(
            0,
            Math.min(
                world.width-W,
                cameraX
            )
        );

}


/* =====================================================
   END OF LEVEL
===================================================== */

function checkEnd(){

    if(
        player.x>
        world.width-350
    ){

        if(
            level<3
        ){

            nextLevel();

        }
        else{

            finishGame();

        }

    }

}


/* =====================================================
   NEXT LEVEL
===================================================== */

function nextLevel(){

    level++;

    updateHUD();

    showMessage(
        "⭐",
        "New Adventure",
        "You made it this far. But the story isn't over yet."
    );

    running=false;

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    icon,
    title,
    text
){

    document.getElementById(
        "messageIcon"
    ).textContent=icon;

    document.getElementById(
        "messageTitle"
    ).textContent=title;

    document.getElementById(
        "messageText"
    ).textContent=text;

    document.getElementById(
        "message"
    ).classList.add("show");

}


/* =====================================================
   CONTINUE
===================================================== */

function continueGame(){

    document.getElementById(
        "message"
    ).classList.remove("show");

    /*
        move slightly forward
    */

    running=true;

}


/* =====================================================
   FINISH
===================================================== */

function finishGame(){

    running=false;

    setTimeout(
        ()=>{
            showMessage(
                "❤️",
                "You Found Home",
                "Maybe home was never a place. Maybe it was the person waiting for you at the end of the adventure."
            );
        },
        300
    );

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    running=false;

    showMessage(
        "💔",
        "The Adventure Paused",
        "Even the longest adventures have difficult moments. Try again and find your way home."
    );

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    document.getElementById(
        "score"
    ).textContent=score;

    document.getElementById(
        "level"
    ).textContent=level;

    document.getElementById(
        "lives"
    ).textContent=
        "♥ ".repeat(
            Math.max(
                0,
                lives
            )
        ).trim();

}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    score=0;

    level=1;

    lives=3;

    cameraX=0;

    frame=0;

    messageOpen=false;

    createLevel();

    createObjects();

    player.x=120;

    player.y=
        world.floor-150;

    player.vx=0;

    player.vy=0;

    player.grounded=false;

    player.doubleJump=false;

    player.invincible=0;

    updateHUD();

    document.getElementById(
        "startScreen"
    ).classList.add("hide");

    running=true;

}


/* =====================================================
   GAME LOOP
===================================================== */

function update(){

    if(!running)
        return;

    frame++;

    updatePlayer();

    collectObjects();

    enemyCollision();

    updateCheckpoints();

    updateCamera();

    checkEnd();

}


function draw(){

    drawSky();

    drawRoom();

    drawPlatforms();

    drawCheckpoints();

    drawStars();

    drawRockets();

    drawEnemies();

    if(
        player.invincible<=0 ||
        Math.floor(frame/5)%2===0
    ){

        drawPlayer();

    }

}


function loop(){

    update();

    draw();

    requestAnimationFrame(
        loop
    );

}

loop();


/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="ArrowLeft" ||
            e.key.toLowerCase()==="a"
        ){

            keys.left=true;

        }

        if(
            e.key==="ArrowRight" ||
            e.key.toLowerCase()==="d"
        ){

            keys.right=true;

        }

        if(
            e.key===" " ||
            e.key==="ArrowUp" ||
            e.key.toLowerCase()==="w"
        ){

            if(!e.repeat){

                jump();

            }

        }

    }
);


window.addEventListener(
    "keyup",
    e=>{

        if(
            e.key==="ArrowLeft" ||
            e.key.toLowerCase()==="a"
        ){

            keys.left=false;

        }

        if(
            e.key==="ArrowRight" ||
            e.key.toLowerCase()==="d"
        ){

            keys.right=false;

        }

    }
);


/* =====================================================
   MOBILE CONTROLS
===================================================== */

function holdButton(
    element,
    action
){

    element.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            action(true);

        }
    );

    element.addEventListener(
        "pointerup",
        e=>{

            e.preventDefault();

            action(false);

        }
    );

    element.addEventListener(
        "pointerleave",
        ()=>{
            action(false);
        }
    );

}


holdButton(
    document.getElementById("leftBtn"),
    state=>{
        keys.left=state;
    }
);


holdButton(
    document.getElementById("rightBtn"),
    state=>{
        keys.right=state;
    }
);


document.getElementById(
    "jumpBtn"
).addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        jump();
    }
);


/* =====================================================
   PREVENT SCROLL
===================================================== */

document.addEventListener(
    "touchmove",
    e=>{
        e.preventDefault();
    },
    {passive:false}
);

</script>

</body>
</html>
